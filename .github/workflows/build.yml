name: Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-modern:
    name: Modern APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Unzip project
        run: |
          unzip TurkTV-MODERN-API21.zip -d modern_src
          INNER=$(ls modern_src/)
          echo "MDIR=modern_src/$INNER" >> $GITHUB_ENV

      - name: Generate gradlew
        working-directory: ${{ env.MDIR }}
        run: gradle wrapper --gradle-version 8.5

      - name: Build APK
        working-directory: ${{ env.MDIR }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurkTV-MODERN-API21
          path: ${{ env.MDIR }}/app/build/outputs/apk/debug/app-debug.apk

  build-legacy:
    name: Legacy APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Unzip project
        run: |
          unzip TurkTV-LEGACY-API16.zip -d legacy_src
          INNER=$(ls legacy_src/)
          echo "LDIR=legacy_src/$INNER" >> $GITHUB_ENV

      - name: Generate gradlew
        working-directory: ${{ env.LDIR }}
        run: gradle wrapper --gradle-version 8.5

      - name: Build APK
        working-directory: ${{ env.LDIR }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TurkTV-LEGACY-API16
          path: ${{ env.LDIR }}/app/build/outputs/apk/debug/app-debug.apk
