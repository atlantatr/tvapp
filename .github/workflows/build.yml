name: Build APK
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build-modern:
    name: Modern APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip Modern
        run: unzip TurkTV-MODERN-API21.zip -d modern_src
      - name: Find project dir
        run: echo "MDIR=modern_src/$(ls modern_src/)" >> $GITHUB_ENV
      - name: Make gradlew executable
        run: chmod +x ${{ env.MDIR }}/gradlew
      - name: Build Modern APK
        working-directory: ${{ env.MDIR }}
        run: ./gradlew assembleDebug --no-daemon
      - name: Copy APK
        run: cp $(find ${{ env.MDIR }} -name "*.apk" | head -1) TurkTV-MODERN.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TurkTV-MODERN-API21
          path: TurkTV-MODERN.apk
  build-legacy:
    name: Legacy APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip Legacy
        run: unzip TurkTV-LEGACY-API16.zip -d legacy_src
      - name: Find project dir
        run: echo "LDIR=legacy_src/$(ls legacy_src/)" >> $GITHUB_ENV
      - name: Make gradlew executable
        run: chmod +x ${{ env.LDIR }}/gradlew
      - name: Build Legacy APK
        working-directory: ${{ env.LDIR }}
        run: ./gradlew assembleDebug --no-daemon
      - name: Copy APK
        run: cp $(find ${{ env.LDIR }} -name "*.apk" | head -1) TurkTV-LEGACY.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TurkTV-LEGACY-API16
          path: TurkTV-LEGACY.apk
